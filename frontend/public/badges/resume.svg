<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="resumeShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1E40AF" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect x="5" y="5" width="90" height="90" rx="22" fill="#FFFFFF" stroke="#1E40AF" stroke-width="2" filter="url(#resumeShadow)" />
  <rect x="7" y="7" width="86" height="86" rx="20" fill="#F8FAFC" />

  <!-- Outer Orbit Ring -->
  <circle cx="50" cy="43" r="26" fill="none" stroke="#BFDBFE" stroke-width="1.8" stroke-dasharray="3 3" />

  <!-- Document / CV Emblem -->
  <g transform="translate(50, 42)">
    <!-- Document Page -->
    <path d="M -15 -17 L 5 -17 L 15 -7 L 15 17 L -15 17 Z" fill="#1E40AF" />
    <!-- Folded Corner -->
    <path d="M 5 -17 L 5 -7 L 15 -7 Z" fill="#60A5FA" />

    <!-- Avatar thumbnail -->
    <circle cx="-8" cy="-9" r="3.2" fill="#FFFFFF" />

    <!-- Text line bars on document -->
    <rect x="-2" y="-11" width="12" height="1.8" rx="0.9" fill="#93C5FD" />
    <rect x="-2" y="-7" width="8" height="1.8" rx="0.9" fill="#93C5FD" />

    <rect x="-11" y="-1" width="22" height="1.8" rx="0.9" fill="#FFFFFF" />
    <rect x="-11" y="4" width="20" height="1.8" rx="0.9" fill="#93C5FD" />
    <rect x="-11" y="9" width="16" height="1.8" rx="0.9" fill="#93C5FD" />

    <!-- Gold ATS Star Seal on bottom right -->
    <circle cx="9" cy="11" r="5.5" fill="#F59E0B" />
    <path d="M 9 7.5 L 9.8 9.5 L 12 9.5 L 10.2 10.8 L 10.8 13 L 9 11.6 L 7.2 13 L 7.8 10.8 L 6 9.5 L 8.2 9.5 Z" fill="#FFFFFF" />
  </g>

  <!-- Bottom Tag -->
  <rect x="18" y="72" width="64" height="15" rx="7.5" fill="#1E40AF" />
  <text x="50" y="82.5" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="900" letter-spacing="0.8">ATS RESUME</text>
</svg>