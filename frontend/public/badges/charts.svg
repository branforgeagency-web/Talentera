<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="chartsShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#059669" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect x="5" y="5" width="90" height="90" rx="22" fill="#FFFFFF" stroke="#059669" stroke-width="2" filter="url(#chartsShadow)" />
  <rect x="7" y="7" width="86" height="86" rx="20" fill="#F0FDF4" />

  <!-- Outer Medical Orbit Ring -->
  <circle cx="50" cy="43" r="26" fill="none" stroke="#A7F3D0" stroke-width="1.8" stroke-dasharray="3 3" />

  <!-- Clinical Chart Clipboard & Heartbeat Wave -->
  <g transform="translate(50, 43)">
    <!-- Clipboard Frame -->
    <rect x="-16" y="-17" width="32" height="32" rx="4" fill="#059669" />
    <!-- Clip Top -->
    <rect x="-7" y="-20" width="14" height="5" rx="2.5" fill="#047857" stroke="#FFFFFF" stroke-width="1" />

    <!-- Sheet inside Clipboard -->
    <rect x="-13" y="-13" width="26" height="25" rx="3" fill="#FFFFFF" />

    <!-- Bar Chart Columns inside Sheet -->
    <rect x="-9" y="1" width="4" height="8" rx="1" fill="#A7F3D0" />
    <rect x="-3" y="-4" width="4" height="13" rx="1" fill="#34D399" />
    <rect x="3" y="-8" width="4" height="17" rx="1" fill="#059669" />

    <!-- Heartbeat Line Overlay -->
    <path d="M -11 -7 L -6 -7 L -4 -11 L -1 0 L 2 -9 L 5 -7 L 11 -7" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Checkmark Seal -->
    <circle cx="9" cy="8" r="4.5" fill="#D97706" />
    <path d="M 7.5 8 L 8.5 9 L 10.5 7" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Bottom Tag -->
  <rect x="18" y="72" width="64" height="15" rx="7.5" fill="#059669" />
  <text x="50" y="82.5" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="900" letter-spacing="0.8">LIVE CHARTS</text>
</svg>