<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="videoShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#E11D48" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect x="5" y="5" width="90" height="90" rx="22" fill="#FFFFFF" stroke="#E11D48" stroke-width="2" filter="url(#videoShadow)" />
  <rect x="7" y="7" width="86" height="86" rx="20" fill="#FFF1F2" />

  <!-- Studio Soundwave Orbit Ring -->
  <circle cx="50" cy="43" r="26" fill="none" stroke="#FDA4AF" stroke-width="1.8" stroke-dasharray="3 3" />

  <!-- Studio Camera Body & Microphone Audio Waves -->
  <g transform="translate(48, 43)">
    <!-- Camera Housing -->
    <rect x="-18" y="-12" width="24" height="22" rx="5" fill="#E11D48" />
    <!-- Recording Red Indicator Dot -->
    <circle cx="-12" cy="-6" r="2" fill="#FFFFFF" />

    <!-- Lens Projection -->
    <path d="M 6 -7 L 16 -13 L 16 11 L 6 5 Z" fill="#E11D48" />

    <!-- Play Arrow inside Camera -->
    <path d="M -8 -3 L -1 1 L -8 5 Z" fill="#FFFFFF" />

    <!-- Sound Waves projecting from Camera -->
    <path d="M 19 -6 Q 22 0 19 6" fill="none" stroke="#BE123C" stroke-width="2" stroke-linecap="round" />
    <path d="M 23 -11 Q 28 0 23 11" fill="none" stroke="#BE123C" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Bottom Tag -->
  <rect x="18" y="72" width="64" height="15" rx="7.5" fill="#E11D48" />
  <text x="50" y="82.5" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="900" letter-spacing="0.8">VIDEO PITCH</text>
</svg>