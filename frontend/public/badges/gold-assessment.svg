<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="goldShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#D97706" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect x="5" y="5" width="90" height="90" rx="22" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2.5" filter="url(#goldShadow)" />
  <rect x="7" y="7" width="86" height="86" rx="20" fill="#FFFDF5" />

  <!-- Outer Ring -->
  <circle cx="50" cy="43" r="26" fill="none" stroke="#FBBF24" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Crown on Top -->
  <g transform="translate(50, 27)">
    <path d="M -10 3 L -12 -5 L -5 -2 L 0 -8 L 5 -2 L 12 -5 L 10 3 Z" fill="#F59E0B" stroke="#B45309" stroke-width="0.8" />
    <circle cx="0" cy="-1" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Number/Text in Center -->
  <text x="50" y="49" text-anchor="middle" fill="url(#goldText)" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" letter-spacing="0.5">GOLD</text>
  <text x="50" y="60" text-anchor="middle" fill="#92400E" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" letter-spacing="1">85+ SCORE</text>

  <!-- Bottom Tag -->
  <rect x="18" y="72" width="64" height="15" rx="7.5" fill="#F59E0B" />
  <text x="50" y="82.5" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="900" letter-spacing="0.8">TOP TIER</text>
</svg>