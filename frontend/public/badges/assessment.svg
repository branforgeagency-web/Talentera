<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="assessShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect x="5" y="5" width="90" height="90" rx="22" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" filter="url(#assessShadow)" />
  <rect x="7" y="7" width="86" height="86" rx="20" fill="#EFF6FF" />

  <!-- Outer Proctoring Ring -->
  <circle cx="50" cy="43" r="26" fill="none" stroke="#93C5FD" stroke-width="1.8" stroke-dasharray="3 3" />

  <!-- Central Brain / Analytical Tech Shield -->
  <g transform="translate(50, 42)">
    <!-- Hexagon Tech Badge Background -->
    <path d="M 0 -18 L 16 -9 L 16 9 L 0 18 L -16 9 L -16 -9 Z" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.5" />

    <!-- Brain / Cognitive Nodes -->
    <path d="M -9 -7 C -12 -7 -12 -2 -8 0 C -12 2 -11 7 -7 7" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" />
    <path d="M 9 -7 C 12 -7 12 -2 8 0 C 12 2 11 7 7 7" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" />
    <path d="M -5 -11 C -2 -13 2 -13 5 -11" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" />
    <path d="M -4 11 C -1 13 1 13 4 11" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" />

    <!-- Center Verification Checkmark -->
    <circle cx="0" cy="0" r="5" fill="#FACC15" />
    <path d="M -2.5 0 L -0.8 1.8 L 2.8 -1.8" fill="none" stroke="#0F172A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Bottom Tag -->
  <rect x="18" y="72" width="64" height="15" rx="7.5" fill="#2563EB" />
  <text x="50" y="82.5" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="900" letter-spacing="0.8">PROCTORED EXAM</text>
</svg>