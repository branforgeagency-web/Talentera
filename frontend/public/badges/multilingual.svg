<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="multiShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F766E" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect x="5" y="5" width="90" height="90" rx="22" fill="#FFFFFF" stroke="#0D9488" stroke-width="2.5" filter="url(#multiShadow)" />
  <rect x="7" y="7" width="86" height="86" rx="20" fill="#F0FDFA" />

  <!-- Global Ring -->
  <circle cx="50" cy="43" r="26" fill="none" stroke="#2DD4BF" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Dual Speech Bubbles -->
  <g transform="translate(42, 36)">
    <rect x="-13" y="-11" width="22" height="18" rx="5" fill="#0D9488" />
    <path d="M -8 7 L -10 11 L -4 7 Z" fill="#0D9488" />
    <text x="-2" y="2" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900">A</text>
  </g>
  <g transform="translate(58, 46)">
    <rect x="-6" y="-11" width="22" height="18" rx="5" fill="#D97706" />
    <path d="M 8 7 L 10 11 L 4 7 Z" fill="#D97706" />
    <text x="5" y="2" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900">अ</text>
  </g>

  <!-- Bottom Tag -->
  <rect x="18" y="72" width="64" height="15" rx="7.5" fill="#0D9488" />
  <text x="50" y="82.5" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="900" letter-spacing="0.8">MULTILINGUAL</text>
</svg>