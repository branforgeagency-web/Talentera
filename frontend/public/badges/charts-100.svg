<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="c100Shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#D97706" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect x="5" y="5" width="90" height="90" rx="22" fill="#FFFFFF" stroke="#D97706" stroke-width="2.5" filter="url(#c100Shadow)" />
  <rect x="7" y="7" width="86" height="86" rx="20" fill="#FFFBEB" />

  <!-- Outer Ring -->
  <circle cx="50" cy="43" r="26" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Double Checkmark on top -->
  <g transform="translate(50, 27)">
    <path d="M -6 -2 L -2 2 L 6 -4" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -2 -2 L 2 2 L 10 -4" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Number 100 in Center -->
  <text x="50" y="49" text-anchor="middle" fill="#92400E" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="-0.5">100</text>
  <text x="50" y="60" text-anchor="middle" fill="#B45309" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" letter-spacing="1">CHARTS LOGGED</text>

  <!-- Bottom Tag -->
  <rect x="18" y="72" width="64" height="15" rx="7.5" fill="#D97706" />
  <text x="50" y="82.5" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="900" letter-spacing="0.8">CENTURY CLUB</text>
</svg>