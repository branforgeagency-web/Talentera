<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="ahimaShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect x="5" y="5" width="90" height="90" rx="22" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5" filter="url(#ahimaShadow)" />
  <rect x="7" y="7" width="86" height="86" rx="20" fill="#F0F9FF" />

  <!-- Outer Ring -->
  <circle cx="50" cy="43" r="26" fill="none" stroke="#0284C7" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.6" />

  <!-- AHIMA Health Information Shield Motif -->
  <g transform="translate(50, 32)">
    <path d="M 0 -8 Q 10 -6 12 2 Q 12 10 0 14 Q -12 10 -12 2 Q -10 -6 0 -8 Z" fill="#0284C7" opacity="0.15" />
    <path d="M 0 -5 L 0 11 M -6 3 L 6 3" stroke="#0284C7" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Bold AHIMA Typography -->
  <text x="50" y="55" text-anchor="middle" fill="#0284C7" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" letter-spacing="1">AHIMA</text>
  <text x="50" y="64" text-anchor="middle" fill="#0369A1" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="800" letter-spacing="0.8">CERTIFIED</text>

  <!-- Bottom Tag -->
  <rect x="18" y="72" width="64" height="15" rx="7.5" fill="#0284C7" />
  <text x="50" y="82.5" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="900" letter-spacing="0.8">CREDENTIAL</text>
</svg>