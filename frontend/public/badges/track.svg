<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="trackShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#D97706" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect x="5" y="5" width="90" height="90" rx="22" fill="#FFFFFF" stroke="#D97706" stroke-width="2" filter="url(#trackShadow)" />
  <rect x="7" y="7" width="86" height="86" rx="20" fill="#FFFBEB" />

  <!-- Radar Orbit Ring -->
  <circle cx="50" cy="43" r="26" fill="none" stroke="#FDE68A" stroke-width="1.8" stroke-dasharray="3 3" />

  <!-- Briefcase & Target GPS Beacon -->
  <g transform="translate(50, 43)">
    <!-- Briefcase Body -->
    <rect x="-17" y="-8" width="34" height="23" rx="4" fill="#D97706" />
    <!-- Briefcase Handle -->
    <path d="M -6 -8 L -6 -14 Q -6 -17 0 -17 Q 6 -17 6 -14 L 6 -8" fill="none" stroke="#B45309" stroke-width="2.5" stroke-linecap="round" />
    <!-- Center Band -->
    <rect x="-17" y="-2" width="34" height="4" fill="#F59E0B" />
    <!-- Latch -->
    <rect x="-3" y="-4" width="6" height="6" rx="1.5" fill="#FFFFFF" />

    <!-- Location GPS Pin on top right -->
    <g transform="translate(9, -10)">
      <path d="M 0 -8 C -4 -8 -6 -5 -6 -2 C -6 2 0 8 0 8 C 0 8 6 2 6 -2 C 6 -5 4 -8 0 -8 Z" fill="#EF4444" stroke="#FFFFFF" stroke-width="1" />
      <circle cx="0" cy="-3" r="2" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Bottom Tag -->
  <rect x="18" y="72" width="64" height="15" rx="7.5" fill="#D97706" />
  <text x="50" y="82.5" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="900" letter-spacing="0.8">PLACEMENT</text>
</svg>