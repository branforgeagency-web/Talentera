<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="cpcShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#005953" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect x="5" y="5" width="90" height="90" rx="22" fill="#FFFFFF" stroke="#005953" stroke-width="2.5" filter="url(#cpcShadow)" />
  <rect x="7" y="7" width="86" height="86" rx="20" fill="#F0FDF4" />

  <!-- Outer Seal Ring -->
  <circle cx="50" cy="43" r="26" fill="none" stroke="#005953" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Rod of Asclepius & Open Book Motif (AAPC Style) -->
  <g transform="translate(50, 31)">
    <!-- Open Book -->
    <path d="M -10 -4 L -10 6 Q -5 4 0 5 Q 5 4 10 6 L 10 -4 Q 5 -6 0 -5 Q -5 -6 -10 -4 Z" fill="none" stroke="#005953" stroke-width="1.5" />
    <!-- Staff with Serpent -->
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#005953" stroke-width="1.8" stroke-linecap="round" />
    <path d="M -3 -4 Q 3 -2 0 1 Q -3 4 3 6" fill="none" stroke="#005953" stroke-width="1.6" stroke-linecap="round" />
  </g>

  <!-- Bold CPC Typography -->
  <text x="50" y="55" text-anchor="middle" fill="#005953" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" letter-spacing="1">CPC</text>
  <text x="50" y="64" text-anchor="middle" fill="#065F46" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="800" letter-spacing="0.8">AAPC CERTIFIED</text>

  <!-- Bottom Tag -->
  <rect x="18" y="72" width="64" height="15" rx="7.5" fill="#005953" />
  <text x="50" y="82.5" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="900" letter-spacing="0.8">CREDENTIAL</text>
</svg>