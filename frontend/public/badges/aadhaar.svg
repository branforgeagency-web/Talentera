<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="aadhaarShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#D97706" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Clean Professional Card Base -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#aadhaarShadow)" />
  <rect x="7" y="7" width="86" height="86" rx="20" fill="#FFFBF5" />

  <!-- Tricolor Accent Top Arc -->
  <path d="M 12 24 Q 50 16 88 24" fill="none" stroke="#FF7722" stroke-width="2.5" stroke-linecap="round" />

  <!-- Official Aadhaar Red Sun Emblem -->
  <g transform="translate(50, 44)">
    <!-- Sun Center -->
    <circle cx="0" cy="0" r="15" fill="#E11D48" />
    
    <!-- Radiating Sun Rays (Official 16 rays style) -->
    <path d="M 0 -22 L 0 -17 M 0 22 L 0 17 M -22 0 L -17 0 M 22 0 L 17 0" stroke="#E11D48" stroke-width="2.5" stroke-linecap="round" />
    <path d="M -15 -15 L -11.5 -11.5 M 15 15 L 11.5 11.5 M -15 15 L -11.5 11.5 M 15 -15 L 11.5 -11.5" stroke="#E11D48" stroke-width="2.5" stroke-linecap="round" />
    <path d="M -8 -20 L -6 -16 M 8 20 L 6 16 M -20 -8 L -16 -6 M 20 8 L 16 6" stroke="#E11D48" stroke-width="2" stroke-linecap="round" />
    <path d="M 8 -20 L 6 -16 M -8 20 L -6 16 M 20 -8 L 16 -6 M -20 8 L -16 6" stroke="#E11D48" stroke-width="2" stroke-linecap="round" />

    <!-- Official Aadhaar Biometric Fingerprint Swirls inside Sun -->
    <path d="M -7 5 A 8 8 0 0 1 -2 -7 A 8 8 0 0 1 7 -2" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
    <path d="M -4 8 A 6 6 0 0 1 -4 -4 A 5 5 0 0 1 4 -3 A 6 6 0 0 1 4 7" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
    <path d="M -1 6 A 3 3 0 0 1 -1 -1 A 2.5 2.5 0 0 1 2 2" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- Official Aadhaar Typography & Verified Pill -->
  <rect x="18" y="72" width="64" height="15" rx="7.5" fill="#138808" />
  <text x="50" y="82.5" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="900" letter-spacing="1">UIDAI · AADHAAR</text>
</svg>