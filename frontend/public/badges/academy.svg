<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="acadGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="acadShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4F46E5" flood-opacity="0.16" />
    </filter>
  </defs>

  <rect x="5" y="5" width="90" height="90" rx="22" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2" filter="url(#acadShadow)" />
  <rect x="7" y="7" width="86" height="86" rx="20" fill="#F8FAFC" />

  <!-- Laurel Wreath -->
  <g stroke="#F59E0B" fill="none" stroke-width="1.6" stroke-linecap="round">
    <path d="M 28 55 C 24 45 28 35 36 29" />
    <path d="M 25 48 Q 28 46 30 50" />
    <path d="M 27 40 Q 30 38 33 42" />
    <path d="M 31 33 Q 35 32 37 36" />

    <path d="M 72 55 C 76 45 72 35 64 29" />
    <path d="M 75 48 Q 72 46 70 50" />
    <path d="M 73 40 Q 70 38 67 42" />
    <path d="M 69 33 Q 65 32 63 36" />
  </g>

  <!-- Graduation Cap -->
  <g transform="translate(50, 42)">
    <!-- Mortarboard Diamond -->
    <path d="M 0 -14 L 24 -4 L 0 6 L -24 -4 Z" fill="#4F46E5" stroke="#3730A3" stroke-width="1.5" />
    <!-- Skull Cap Underneath -->
    <path d="M -15 1 L -15 9 Q 0 16 15 9 L 15 1 Q 0 7 -15 1 Z" fill="#3730A3" />
    <!-- Tassel Button & String -->
    <circle cx="0" cy="-4" r="2" fill="#F59E0B" />
    <path d="M 0 -4 L 18 4 L 18 16" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="18" cy="17" r="2" fill="#F59E0B" />
  </g>

  <!-- Bottom Tag -->
  <rect x="18" y="72" width="64" height="15" rx="7.5" fill="#4F46E5" />
  <text x="50" y="82.5" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="900" letter-spacing="0.8">FOUNDATION</text>
</svg>